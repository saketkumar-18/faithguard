services:
  - type: web
    name: faithguard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FG_LLM_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: FG_LLM_MODEL
        value: qwen/qwen3.8-max-free
      - key: FG_LLM_KEY_ENV
        value: TOKENROUTER_API_KEY
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: FG_LOG_LEVEL
        value: INFO
      # 512 MB free tier: skip the ~240 MB embedding model, retrieve with BM25.
      - key: FG_USE_DENSE
        value: "0"
